<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Palpite da Copa</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      background: #1a6b2f;
    }

    .card {
      background: white;
      padding: 2rem;
      border-radius: 12px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.3);
    }

    h1 {
      text-align: center;
      color: #1a6b2f;
      margin-top: 0;
    }

    label {
      display: block;
      margin-bottom: 0.3rem;
      font-weight: bold;
    }

    input, select {
      width: 100%;
      padding: 0.6rem;
      margin-bottom: 1.2rem;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 1rem;
      box-sizing: border-box;
    }

    button {
      width: 100%;
      padding: 0.75rem;
      background: #1a6b2f;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      cursor: pointer;
    }

    button:hover {
      background: #145524;
    }

    #mensagem {
      display: none;
      text-align: center;
      margin-top: 1rem;
      padding: 0.75rem;
      background: #d4edda;
      color: #155724;
      border-radius: 6px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="card">
    <img src="./images/Copa.png" alt="Copa 2026" style="display:block;margin:0 auto 1rem;width:120px;">
    <h1>⚽ Palpite da Copa</h1>
    <form id="form">
      <label for="nome">Seu nome</label>
      <input type="text" id="nome" placeholder="Digite seu nome" required>

      <label for="selecao">Seleção campeã</label>
      <select id="selecao" required>
        <option value="">Selecione uma seleção</option>
        <option>Brasil</option>
        <option>Argentina</option>
        <option>França</option>
        <option>Alemanha</option>
        <option>Espanha</option>
        <option>Inglaterra</option>
        <option>Portugal</option>
        <option>Itália</option>
        <option>Holanda</option>
        <option>Bélgica</option>
        <option>Croácia</option>
        <option>Uruguai</option>
        <option>México</option>
        <option>Estados Unidos</option>
        <option>Japão</option>
        <option>Marrocos</option>
        <option>Senegal</option>
        <option>Austrália</option>
        <option>Coreia do Sul</option>
        <option>Suíça</option>
      </select>

      <button type="submit">Enviar palpite</button>
    </form>
    <div id="mensagem">
      <p>✅ Palpite enviado!</p>
      <button type="button" onclick="novoPalpite()">Enviar novo palpite</button>
    </div>
  </div>

  <script>
    document.getElementById('form').addEventListener('submit', function(e) {
      e.preventDefault();
      this.style.display = 'none';
      document.getElementById('mensagem').style.display = 'block';
    });

    function novoPalpite() {
      const form = document.getElementById('form');
      form.reset();
      form.style.display = 'block';
      document.getElementById('mensagem').style.display = 'none';
    }
  </script>
</body>
</html>
